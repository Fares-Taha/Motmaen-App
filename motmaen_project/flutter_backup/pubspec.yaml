name: motmaen
description: Your smart companion for diabetes care
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  intl: ^0.19.0
  shared_preferences: ^2.4.2
  sqflite: ^2.4.0
  path: ^1.9.0
  tflite_flutter: ^0.11.0
  image: ^4.3.0
  image_picker: ^1.2.0
  camera: ^0.11.0+2
  syncfusion_flutter_charts: ^31.2.2
  url_launcher: ^6.1.12
  package_info_plus: ^4.2.0
  restart_app: ^1.2.1
  provider: ^6.1.1

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/models/model_v5_fine_tuned_int8.tflite
    - assets/models/labels.txt
    - assets/images/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/icon.png"
  remove_alpha_ios: true

flutter_native_splash:
    color: "#ffffff"